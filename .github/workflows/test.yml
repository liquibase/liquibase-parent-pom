name: Build and Test

on:
  workflow_dispatch:
  # Use pull_request (not pull_request_target) so PRs never run with repository
  # secrets over an untrusted checkout. Same-repo PRs still receive secrets and
  # build normally; forked PRs run without secrets.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write

jobs:
  build-test:
    uses: liquibase/build-logic/.github/workflows/os-extension-test.yml@main
    secrets: inherit

  dependabot:
    needs: build-test
    uses: liquibase/build-logic/.github/workflows/dependabot-automerge.yml@main
    secrets: inherit
